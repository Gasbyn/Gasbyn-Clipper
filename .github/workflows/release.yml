name: Release

# Při pushnutí tagu v1.2.3 se na Windows runneru sestaví aplikace a Setup.exe
# se připojí k GitHub Release s tímto tagem.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Download ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $bin = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path ffmpeg_pkg | Out-Null
          Copy-Item $bin.FullName ffmpeg_pkg\ffmpeg.exe

      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onedir --name GasbynClipper `
            --collect-all yt_dlp --collect-all faster_whisper --collect-all ctranslate2 `
            clipper.py
          Copy-Item settings.yaml dist\GasbynClipper\
          New-Item -ItemType Directory -Force -Path dist\GasbynClipper\ffmpeg | Out-Null
          Copy-Item ffmpeg_pkg\ffmpeg.exe dist\GasbynClipper\ffmpeg\

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if (-not (Test-Path Output\Setup.exe)) { throw "Setup.exe nebyl vytvořen" }

      - name: Publish release with Setup.exe
        uses: softprops/action-gh-release@v2
        with:
          files: Output/Setup.exe
          generate_release_notes: true
