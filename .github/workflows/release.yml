name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Build app with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --console --name GasbynClipper `
            --collect-all faster_whisper --collect-all ctranslate2 --collect-all yt_dlp `
            clipper.py

      - name: Copy settings and ffmpeg next to the exe
        shell: pwsh
        run: |
          Copy-Item settings.yaml dist\GasbynClipper\
          $ff = (Get-Command ffmpeg).Source
          Copy-Item $ff dist\GasbynClipper\
          $ffprobe = Join-Path (Split-Path $ff) "ffprobe.exe"
          if (Test-Path $ffprobe) { Copy-Item $ffprobe dist\GasbynClipper\ }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Setup.exe
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if (-not $version) { $version = "0.0.0" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$version" installer.iss

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Setup.exe
          generate_release_notes: true
