name: Release

# Při pushnutí tagu v1.2.3 se na Windows runneru sestaví aplikace a Setup.exe
# se připojí k GitHub Release s tímto tagem.
#
# Volitelný podpis certifikátem: nastav repo secrets CODESIGN_PFX_BASE64 (PFX soubor v base64)
# a CODESIGN_PASSWORD. Bez nich se build podepíše nepodepsaný, jako dosud.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Verze, např. v1.2.0 (Release s tímto tagem se vytvoří na aktuálním commitu main)"
        required: true
        default: "v1.2.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
      CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set version from tag
        shell: pwsh
        run: python set_version.py $env:RELEASE_TAG

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Download ffmpeg
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 1; $i -le 5 -and -not $ok; $i++) {
            try {
              Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip -UseBasicParsing
              $ok = $true
            } catch {
              Write-Host "Pokus $i selhal, čekám 30 s..."
              Start-Sleep -Seconds 30
            }
          }
          if (-not $ok) { throw "ffmpeg se nepodařilo stáhnout" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $bin = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path ffmpeg_pkg | Out-Null
          Copy-Item $bin.FullName ffmpeg_pkg\ffmpeg.exe
          $probe = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $probe.FullName ffmpeg_pkg\ffprobe.exe

      - name: Generate executable version metadata
        shell: pwsh
        run: python build_version_info.py

      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --noupx --onedir --windowed `
            --name GasbynClipper --version-file build\version_info.txt `
            --collect-all yt_dlp --collect-all faster_whisper --collect-all ctranslate2 `
            --collect-all customtkinter --collect-all googleapiclient `
            --collect-all google_auth_oauthlib `
            app.py
          # settings.yaml se do instalace nekopíruje: nastavení žijí v %APPDATA%\GasbynClipper
          New-Item -ItemType Directory -Force -Path dist\GasbynClipper\ffmpeg | Out-Null
          Copy-Item ffmpeg_pkg\ffmpeg.exe dist\GasbynClipper\ffmpeg\
          Copy-Item ffmpeg_pkg\ffprobe.exe dist\GasbynClipper\ffmpeg\

      - name: Verify executable metadata
        shell: pwsh
        run: |
          $info = (Get-Item dist\GasbynClipper\GasbynClipper.exe).VersionInfo
          $checks = @{
            CompanyName = 'Gasbyn'
            ProductName = 'Gasbyn Clipper'
            FileDescription = 'AI Video Clipper for Windows'
            OriginalFilename = 'GasbynClipper.exe'
            InternalName = 'GasbynClipper'
          }
          foreach ($entry in $checks.GetEnumerator()) {
            $actual = [string]$info.($entry.Key)
            if ($actual -ne $entry.Value) {
              throw "Metadata $($entry.Key) nesouhlasí. Očekáváno '$($entry.Value)', nalezeno '$actual'."
            }
            Write-Host "$($entry.Key): $actual"
          }
          Write-Host "FileVersion: $($info.FileVersion)"
          Write-Host "ProductVersion: $($info.ProductVersion)"
      - name: Sign application (optional)
        shell: pwsh
        run: |
          if (-not $env:CODESIGN_PFX_BASE64) { Write-Host "Podpis přeskočen (chybí secret)."; exit 0 }
          [IO.File]::WriteAllBytes("$PWD\cert.pfx", [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool.FullName sign /f cert.pfx /p $env:CODESIGN_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 /d "Gasbyn Clipper" `
            dist\GasbynClipper\GasbynClipper.exe
          if ($LASTEXITCODE -ne 0) { throw "Podpis aplikace selhal" }

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if (-not (Test-Path Output\Setup.exe)) { throw "Setup.exe nebyl vytvořen" }

      - name: Verify installer metadata
        shell: pwsh
        run: |
          $info = (Get-Item Output\Setup.exe).VersionInfo
          $checks = @{
            CompanyName = 'Gasbyn'
            ProductName = 'Gasbyn Clipper'
            FileDescription = 'Gasbyn Clipper Setup'
            OriginalFilename = 'Setup.exe'
          }
          # Jen varování: u instalátoru Inno Setup nedoložená hodnota nesmí zablokovat vydání.
          # Skutečné hodnoty se vypíšou, aby bylo vidět, co Inno zapsal.
          foreach ($entry in $checks.GetEnumerator()) {
            $actual = ([string]$info.($entry.Key)).Trim()
            if ($actual -ne $entry.Value) {
              Write-Host "::warning::Metadata instalátoru $($entry.Key) nesouhlasí. Očekáváno '$($entry.Value)', nalezeno '$actual'."
            } else {
              Write-Host "$($entry.Key): $actual"
            }
          }
          Write-Host "FileVersion: $($info.FileVersion)"
          Write-Host "ProductVersion: $($info.ProductVersion)"
          Write-Host "Setup.exe CompanyName raw: '$($info.CompanyName)' ProductName raw: '$($info.ProductName)'"

      - name: Sign installer (optional)
        shell: pwsh
        run: |
          if (-not $env:CODESIGN_PFX_BASE64) { exit 0 }
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool.FullName sign /f cert.pfx /p $env:CODESIGN_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 /d "Gasbyn Clipper Setup" `
            Output\Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "Podpis instalátoru selhal" }

      - name: Publish release with Setup.exe
        uses: softprops/action-gh-release@v2
        with:
          files: Output/Setup.exe
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
